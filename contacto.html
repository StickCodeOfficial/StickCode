<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contacto | StickCode</title>
<meta name="description" content="Escríbeme para hablar de un proyecto, reportar un error o proponer una idea.">
<link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="nav solid">
	<a href="index.html" class="nav-logo">STICKCODE</a>
	<div class="nav-links">
    <a href="index.html">Inicio</a>
    <a href="apps.html">Apps</a>
    <a href="contacto.html" class="active">Contacto</a>
    <a href="https://www.instagram.com/stickcodeofficial" target="_blank" rel="noopener" class="nav-ig" aria-label="Instagram de StickCode">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path><line x1="17.5" x2="17.51" y1="6.5" y2="6.5"></line></svg>
    </a>
    <span class="nav-counter"><span class="nav-counter-dot">●</span> <span data-site-counter>···</span></span>
  </div>
	<button class="nav-toggle" id="navToggle" aria-label="Abrir menú"><span></span><span></span><span></span></button>
</nav>

<header class="page-header wrap">
  <h1>Hablemos</h1>
  <p>¿Encontraste un error en una app, tienes una idea, o quieres proponer un proyecto? Escríbeme directamente.</p>
</header>

<section class="wrap">
  <div class="contact-block">
    <a href="mailto:contacto@stickcode.dev" class="contact-email">stickcodeofficial@gmail.com</a>
    <div class="contact-meta">
      <a href="https://www.instagram.com/stickcodeofficial" target="_blank" rel="noopener">Instagram</a>
      <a href="mailto:stickcodeofficial@gmail.com">Correo</a>
    </div>
  </div>
</section>

<footer class="wrap">
  <span>© <span id="year"></span> StickCode</span>
  <a href="privacidad.html">Política de Privacidad</a>
</footer>

<script>
  document.getElementById('year').textContent = new Date().getFullYear();
</script>


<script>
  (function () {
    var els = document.querySelectorAll('[data-site-counter]');
    if (!els.length) return;
    fetch('https://countapi.mileshilliard.com/api/v1/hit/stickcode-dev-site-visits')
      .then(function (res) { return res.json(); })
      .then(function (data) {
        var count = data && data.value !== undefined ? parseInt(data.value, 10) : null;
        els.forEach(function (el) {
          el.textContent = (typeof count === 'number' && !isNaN(count)) ? count.toLocaleString('es-CO') : '—';
        });
      })
      .catch(function () {
        els.forEach(function (el) { el.textContent = '—'; });
      });
  })();
</script>

<script>
  const navToggle = document.getElementById('navToggle');
  const navLinks = document.querySelector('.nav-links');
  if (navToggle && navLinks) {
    navToggle.addEventListener('click', () => {
      navToggle.classList.toggle('open');
      navLinks.classList.toggle('open');
    });
    navLinks.querySelectorAll('a').forEach(a => {
      a.addEventListener('click', () => {
        navToggle.classList.remove('open');
        navLinks.classList.remove('open');
      });
    });
  }
</script>
</body>
</html>
