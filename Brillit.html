<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Galaxia de Flores Amarillas 🌻</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Parisienne&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,500;1,600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#04030a;
    --bg-mid:#0c0820;
    --gold:#ffd447;
    --gold-soft:#ffe9a8;
    --text-dim:#c9c3e0;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  html{
    scroll-padding-top:env(safe-area-inset-top,0px);
    height:100%;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    height:100%;
    width:100%;
    overflow:hidden;
    background:radial-gradient(ellipse at 50% 40%, var(--bg-mid) 0%, var(--bg-deep) 65%, #000 100%);
    font-family:'Cormorant Garamond', Georgia, serif;
    color:var(--gold-soft);
    touch-action:none;
  }
  #canvasHolder{
    position:fixed;
    inset:0;
    z-index:1;
  }
  #canvasHolder canvas{
    display:block;
    width:100%;
    height:100%;
  }

  .ui-layer{
    position:fixed;
    inset:0;
    z-index:5;
    pointer-events:none;
  }

  header{
    position:absolute;
    top:calc(18px + env(safe-area-inset-top,0px));
    left:0;
    right:0;
    text-align:center;
    padding:0 14px;
  }
  header h1{
    margin:0;
    font-family:'Parisienne', cursive;
    font-size:clamp(30px, 8vw, 54px);
    font-weight:400;
    letter-spacing:0.5px;
    line-height:1.15;
    color:var(--gold);
    text-shadow:
      0 0 8px rgba(255,212,71,0.85),
      0 0 24px rgba(255,212,71,0.55),
      0 0 46px rgba(255,180,40,0.35);
  }
  header p{
    margin:8px 0 0;
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-weight:500;
    font-size:clamp(14px, 3.6vw, 18px);
    color:var(--text-dim);
    letter-spacing:2.5px;
  }

  .hint{
    position:absolute;
    bottom:calc(18px + env(safe-area-inset-bottom,0px));
    left:0;
    right:0;
    text-align:center;
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-size:14px;
    color:#a89fd6;
    letter-spacing:1px;
    opacity:0.75;
    animation:fadePulse 3.5s ease-in-out infinite;
  }
  @keyframes fadePulse{
    0%,100%{opacity:0.35;}
    50%{opacity:0.85;}
  }

  .brand{
    position:absolute;
    right:calc(14px + env(safe-area-inset-right,0px));
    bottom:calc(14px + env(safe-area-inset-bottom,0px));
    display:flex;
    align-items:center;
    gap:8px;
    background:rgba(10,6,24,0.45);
    border:1px solid rgba(255,212,71,0.25);
    backdrop-filter:blur(6px);
    padding:7px 12px 7px 10px;
    border-radius:999px;
    pointer-events:auto;
  }
  .brand img{
    height:20px;
    width:auto;
    display:block;
    filter:drop-shadow(0 0 4px rgba(255,212,71,0.6));
  }
  .brand span{
    font-family:'Cormorant Garamond', serif;
    font-size:12px;
    color:var(--text-dim);
    white-space:nowrap;
  }
  .brand b{
    color:var(--gold-soft);
    font-weight:700;
  }

  #loading{
    position:fixed;
    inset:0;
    z-index:10;
    background:var(--bg-deep);
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    gap:14px;
    transition:opacity 0.6s ease;
  }
  #loading .spinner{
    width:38px;height:38px;
    border-radius:50%;
    border:3px solid rgba(255,212,71,0.2);
    border-top-color:var(--gold);
    animation:spin 1s linear infinite;
  }
  #loading p{
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    color:var(--text-dim);
    font-size:15px;
    letter-spacing:1px;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>

<div id="loading"><div class="spinner"></div><p>Encendiendo las estrellas…</p></div>

let camState = { theta: 0.55, phi: 1.25, radius: 620 };
const camTarget = new THREE.Vector3(0,0,0);

function updateCamera(){
  const { theta, phi, radius } = camState;
  camera.position.x = radius * Math.sin(phi) * Math.cos(theta);
  camera.position.y = radius * Math.cos(phi);
  camera.position.z = radius * Math.sin(phi) * Math.sin(theta);
  camera.lookAt(camTarget);
}
updateCamera();

/* ============ STARFIELD ============ */
function makeStarField(count, spread, size, colorHex){
  const geo = new THREE.BufferGeometry();
  const positions = new Float32Array(count*3);
  for(let i=0;i<count;i++){
    const r = spread * (0.35 + Math.random()*0.65);
    const theta = Math.random()*Math.PI*2;
    const phi = Math.acos((Math.random()*2)-1);
    positions[i*3]   = r*Math.sin(phi)*Math.cos(theta);
    positions[i*3+1] = r*Math.cos(phi)*0.6;
    positions[i*3+2] = r*Math.sin(phi)*Math.sin(theta);
  }
  geo.setAttribute('position', new THREE.BufferAttribute(positions,3));
  const mat = new THREE.PointsMaterial({ color: colorHex, size: size, transparent:true, opacity:0.85, sizeAttenuation:true });
  return new THREE.Points(geo, mat);
}
scene.add(makeStarField(1400, 1400, 1.6, 0xffffff));
scene.add(makeStarField(500, 900, 2.6, 0xffe9a8));
scene.add(makeStarField(220, 500, 1.2, 0xfff6d8));

/* subtle nebula haze using large transparent sprites */
function makeGlowTexture(colorInner, colorOuter, size=256){
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(size/2,size/2,0,size/2,size/2,size/2);
  g.addColorStop(0, colorInner);
  g.addColorStop(0.4, colorOuter);
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0,0,size,size);
  return new THREE.CanvasTexture(c);
}

const nebulaTex = makeGlowTexture('rgba(255,210,120,0.10)','rgba(120,80,200,0.06)', 512);
for(let i=0;i<5;i++){
  const spr = new THREE.Sprite(new THREE.SpriteMaterial({ map: nebulaTex, transparent:true, depthWrite:false, blending: THREE.AdditiveBlending }));
  const r = 500 + Math.random()*500;
  const a = Math.random()*Math.PI*2;
  spr.position.set(Math.cos(a)*r, (Math.random()-0.5)*260, Math.sin(a)*r);
  const s = 500 + Math.random()*500;
  spr.scale.set(s,s,1);
  scene.add(spr);
}

/* ============ SUN ============ */
const sunGroup = new THREE.Group();
scene.add(sunGroup);

const sunGlowTex = makeGlowTexture('rgba(255,244,200,1)','rgba(255,190,60,0.55)', 512);
const sunGlow = new THREE.Sprite(new THREE.SpriteMaterial({ map: sunGlowTex, transparent:true, depthWrite:false, blending: THREE.AdditiveBlending }));
sunGlow.scale.set(260,260,1);
sunGroup.add(sunGlow);

const sunCoreGeo = new THREE.SphereGeometry(22, 32, 32);
const sunCoreMat = new THREE.MeshBasicMaterial({ color:0xfff3c4 });
const sunCore = new THREE.Mesh(sunCoreGeo, sunCoreMat);
sunGroup.add(sunCore);

const sunLight = new THREE.PointLight(0xffdca0, 1.4, 1800, 1.6);
sunGroup.add(sunLight);
scene.add(new THREE.AmbientLight(0x3a2f55, 0.9));

/* ============ TEXT LABEL SPRITES ============ */
function makeLabelSprite(text){
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');
  const fontSize = 42;
  ctx.font = `italic 600 ${fontSize}px "Cormorant Garamond", Georgia, serif`;
  const paddingX = 26;
  const textWidth = ctx.measureText(text).width;
  canvas.width = Math.ceil(textWidth + paddingX*2);
  canvas.height = fontSize + 40;

  ctx.font = `italic 600 ${fontSize}px "Cormorant Garamond", Georgia, serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  ctx.shadowColor = 'rgba(255,210,110,0.95)';
  ctx.shadowBlur = 18;
  ctx.fillStyle = '#fff3d0';
  ctx.fillText(text, canvas.width/2, canvas.height/2);
  ctx.shadowBlur = 0;
  ctx.fillStyle = 'rgba(255,236,180,0.95)';
  ctx.fillText(text, canvas.width/2, canvas.height/2);

  const tex = new THREE.CanvasTexture(canvas);
  tex.minFilter = THREE.LinearFilter;
  const mat = new THREE.SpriteMaterial({ map: tex, transparent:true, depthWrite:false });
  const spr = new THREE.Sprite(mat);
  const aspect = canvas.width / canvas.height;
  const h = 15;
  spr.scale.set(h*aspect, h, 1);
  return spr;
}

/* ============ BRAND PARTICLE TEXT ============ */
let brandPoints = null;
const brandUniforms = {
  uTime:  { value: 0 },
  uForm:  { value: 0 },
  uSize:  { value: BRAND.particleSize },
  uScale: { value: 1 }
};
function updateBrandScale(){
  const h = renderer.getSize(new THREE.Vector2()).y * renderer.getPixelRatio();
  brandUniforms.uScale.value = h / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov/2)));
}

function buildBrandParticles(){
  const c = document.createElement('canvas');
  const ctx = c.getContext('2d');
  ctx.font = BRAND.font;
  const m = ctx.measureText(BRAND.text);
  const pad = 30;
  const fontPx = parseInt((BRAND.font.match(/(\d+)px/)||[0,150])[1], 10);
  c.width  = Math.ceil(m.width) + pad*2;
  c.height = Math.ceil(fontPx*1.5);
  ctx.font = BRAND.font;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = '#fff';
  ctx.fillText(BRAND.text, c.width/2, c.height/2);

  const img = ctx.getImageData(0,0,c.width,c.height).data;
  const step = Math.max(1, BRAND.density);
  const k = BRAND.width / Math.ceil(m.width);
  const top = new THREE.Color(BRAND.colorTop), bot = new THREE.Color(BRAND.colorBottom);

  const pos=[], scat=[], seed=[], col=[];
  for(let y=0; y<c.height; y+=step){
    for(let x=0; x<c.width; x+=step){
      if(img[(y*c.width+x)*4+3] > 128){
        const px = (x - c.width/2) * k + (Math.random()-0.5)*k*step*0.6;
        const py = -(y - c.height/2) * k + (Math.random()-0.5)*k*step*0.6;
        pos.push(px, py, (Math.random()-0.5)*3);
        const a = Math.random()*Math.PI*2, r = 120 + Math.random()*260;
        scat.push(Math.cos(a)*r, Math.sin(a)*r*0.6, (Math.random()-0.5)*260);
        seed.push(Math.random());
        const t = (y/c.height - 0.25) / 0.5;
        const cc = top.clone().lerp(bot, Math.min(1, Math.max(0, t)));
        col.push(cc.r, cc.g, cc.b);
      }
    }
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
  geo.setAttribute('aScatter', new THREE.Float32BufferAttribute(scat,3));
  geo.setAttribute('aSeed',    new THREE.Float32BufferAttribute(seed,1));
  geo.setAttribute('aColor',   new THREE.Float32BufferAttribute(col,3));

  const mat = new THREE.ShaderMaterial({
    uniforms: brandUniforms,
    transparent: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending,
    vertexShader: `
      attribute vec3 aScatter; attribute float aSeed; attribute vec3 aColor;
      uniform float uTime, uForm, uSize, uScale;
      varying vec3 vColor; varying float vTw;
      void main(){
        float e = uForm*uForm*(3.0-2.0*uForm);
        vec3 p = mix(aScatter, position, e);
        p.x += sin(uTime*1.3 + aSeed*40.0) * 0.45;
        p.y += cos(uTime*1.1 + aSeed*25.0) * 0.45;
        vec4 mv = modelViewMatrix * vec4(p,1.0);
        vTw = 0.55 + 0.45*sin(uTime*2.4 + aSeed*6.2831);
        vColor = aColor;
        gl_PointSize = uSize * uScale / -mv.z * (0.8 + 0.5*vTw);
        gl_Position = projectionMatrix * mv;
      }`,
    fragmentShader: `
      varying vec3 vColor; varying float vTw;
      void main(){
        float d = length(gl_PointCoord - 0.5);
        if(d > 0.5) discard;
        float a = pow(1.0 - d*2.0, 1.6) * vTw;
        gl_FragColor = vec4(vColor * 1.25, a);
      }`
  });

  brandPoints = new THREE.Points(geo, mat);
  brandPoints.frustumCulled = false;
  brandPoints.position.set(0, BRAND.height, 0);
  scene.add(brandPoints);
  updateBrandScale();
}

(document.fonts && document.fonts.load
  ? document.fonts.load(BRAND.font, BRAND.text).catch(()=>{})
  : Promise.resolve()
).then(buildBrandParticles);

/* ============ FLOWER SPRITES (galaxy spiral layout) ============ */
const galaxyGroup = new THREE.Group();
scene.add(galaxyGroup);

const loader = new THREE.TextureLoader();
const goldenAngle = Math.PI * (3 - Math.sqrt(5));
const armCount = 2;
let loadedCount = 0;

const fontsReady = (document.fonts && document.fonts.ready) ? document.fonts.ready : Promise.resolve();

fontsReady.then(() => {
FLOWERS.forEach((f, i) => {
  loader.load(f.src, (tex) => {
    tex.minFilter = THREE.LinearFilter;
    tex.magFilter = THREE.LinearFilter;

    const arm = i % armCount;
    const t = i / FLOWERS.length;
    const radius = 90 + t * 340;
    const angle = i * goldenAngle + arm * Math.PI;
    const height = Math.sin(i * 1.7) * 55 + (Math.random()-0.5)*20;

    const holder3D = new THREE.Group();
    holder3D.position.set(
      Math.cos(angle) * radius,
      height,
      Math.sin(angle) * radius
    );
    holder3D.userData = {
      baseAngle: angle,
      radius: radius,
      baseHeight: height,
      speed: 0.05 + (1 - t) * 0.05,
      bob: Math.random()*Math.PI*2
    };

    const flowerMat = new THREE.SpriteMaterial({ map: tex, transparent:true, depthWrite:false });
    const flowerSprite = new THREE.Sprite(flowerMat);
    const imgAspect = tex.image.width / tex.image.height;
    const baseSize = 58 + Math.random()*20;
    flowerSprite.scale.set(baseSize*imgAspect, baseSize, 1);
    flowerSprite.position.set(0,0,0);
    holder3D.add(flowerSprite);

    const label = makeLabelSprite(f.label);
    label.position.set(0, -(baseSize*0.62), 0);
    holder3D.add(label);

    galaxyGroup.add(holder3D);

    loadedCount++;
    if(loadedCount === FLOWERS.length){
      const loadingEl = document.getElementById('loading');
      loadingEl.style.opacity = '0';
      setTimeout(()=> loadingEl.style.display='none', 650);
    }
  });
});
});

/* ============ INTERACTION (manual orbit + zoom) ============ */
let isDragging = false;
let lastX = 0, lastY = 0;

function onDown(x,y){ isDragging = true; lastX = x; lastY = y; }
function onMove(x,y){
  if(!isDragging) return;
  const dx = x - lastX;
  const dy = y - lastY;
  camState.theta -= dx * 0.0045;
  camState.phi   -= dy * 0.0035;
  camState.phi = Math.max(0.35, Math.min(Math.PI - 0.35, camState.phi));
  lastX = x; lastY = y;
  updateCamera();
}
function onUp(){ isDragging = false; }

renderer.domElement.addEventListener('mousedown', e => onDown(e.clientX, e.clientY));
window.addEventListener('mousemove', e => onMove(e.clientX, e.clientY));
window.addEventListener('mouseup', onUp);

renderer.domElement.addEventListener('touchstart', e => {
  if(e.touches.length === 1){ onDown(e.touches[0].clientX, e.touches[0].clientY); }
  lastPinchDist = null;
}, {passive:true});
renderer.domElement.addEventListener('touchmove', e => {
  if(e.touches.length === 1){
    onMove(e.touches[0].clientX, e.touches[0].clientY);
  } else if(e.touches.length === 2){
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    const dist = Math.sqrt(dx*dx+dy*dy);
    if(lastPinchDist != null){
      const delta = dist - lastPinchDist;
      camState.radius = Math.max(180, Math.min(1400, camState.radius - delta*1.8));
      updateCamera();
    }
    lastPinchDist = dist;
  }
}, {passive:true});
renderer.domElement.addEventListener('touchend', () => { isDragging = false; lastPinchDist = null; });
let lastPinchDist = null;

renderer.domElement.addEventListener('wheel', e => {
  e.preventDefault();
  camState.radius = Math.max(180, Math.min(1400, camState.radius + e.deltaY * 0.5));
  updateCamera();
}, {passive:false});

/* ============ RESIZE ============ */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  updateBrandScale();
});

/* ============ ANIMATE ============ */
const clock = new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  galaxyGroup.rotation.y = t * 0.028;

  galaxyGroup.children.forEach(holder3D => {
    const d = holder3D.userData;
    if(!d) return;
    const bob = Math.sin(t*0.6 + d.bob) * 6;
    holder3D.position.y = d.baseHeight + bob;
  });

  if(brandPoints){
    brandUniforms.uTime.value = t;
    brandUniforms.uForm.value = Math.min(1, t / BRAND.introSeconds);
    brandPoints.quaternion.copy(camera.quaternion);          // siempre de frente a la cámara
    brandPoints.position.y = BRAND.height + Math.sin(t*0.8)*2; // flota suavemente
  }

  sunCore.rotation.y = t * 0.15;
  const pulse = 1 + Math.sin(t*1.4)*0.05;
  sunGlow.scale.set(260*pulse,260*pulse,1);

  if(!isDragging){
    camState.theta += 0.0009;
    updateCamera();
  }

  renderer.render(scene, camera);
}
animate();
</script>
